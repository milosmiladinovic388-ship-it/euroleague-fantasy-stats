# Osvežava podatke više puta dnevno i objavljuje aplikaciju na GitHub Pages.
# Ništa ne upisuje nazad u repozitorijum: odigrane utakmice čuva u Actions kešu.
name: Osvezi podatke i objavi

on:
  schedule:
    - cron: '15 */3 * * *'   # na svaka 3 sata
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Box score-ovi odigranih utakmica; svaki prolaz čuva novu verziju keša
      - uses: actions/cache@v4
        with:
          path: cache
          key: games-${{ github.run_id }}
          restore-keys: games-
      - name: Preuzmi podatke
        run: node scripts/fetch-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pripremi sajt
        run: |
          mkdir -p public
          cp -r index.html styles.css model.js app.js sw.js manifest.webmanifest icons data public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
